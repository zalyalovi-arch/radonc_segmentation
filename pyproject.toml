# ============================================================
# pyproject.toml — метаданные пакета radonc_segmentation
# ------------------------------------------------------------
# Установка в окружение (после setup_env.py / requirements.txt):
#   python -m pip install -e .
# Экстры:
#   python -m pip install -e .[quantization]   # импорт .pth -> IR и INT8-квантизация (нужен torch: requirements-torch-cpu.txt)
#   python -m pip install -e .[native]         # стек нативного движка без torch (поверх установленного torch)
#   python -m pip install -e .[dev]            # сборка exe и тесты
# GPU-машины: вместо первых двух — файл целиком (torch CUDA + весь стек):
#   python -m pip install -r requirements-gpu.txt
# Запуск после установки (или из корня проекта без установки):
#   python -m gui.main
#   python -m radonc_segmentation.pipeline <PATIENT_ID>
# ============================================================
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radonc_segmentation"
version = "1.0.0"
description = "GUI pipeline for H&N organs-at-risk segmentation (OpenVINO inference, DICOM/RTSTRUCT)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zalyalovi-arch" }]
dependencies = [
    "openvino==2025.2.0",
    "numpy==2.1.3",
    "scipy==1.15.3",
    "SimpleITK==2.5.3",
    "pydicom==3.0.1",
    "nibabel==5.3.3",
    "rt-utils==1.2.7",
]

[project.optional-dependencies]
# Импорт .pth -> IR и INT8-квантизация (scripts-обёртки в
# radonc_segmentation/quantization/). Работает с ЛЮБОЙ сборкой torch:
# CPU-сборку ставит requirements-torch-cpu.txt / setup_env.py, CUDA —
# requirements-gpu.txt. Экстра не тянет torch, чтобы не ломать уже
# установленную сборку.
quantization = [
    "onnx==1.17.0",
    "onnxruntime>=1.20.0",
    "nncf==2.19.0",
    "jstyleson==0.0.2",
    "dynamic_network_architectures==0.4.2",
]
# Стек нативного nnUNet-движка (nnunet_native) без torch: поверх уже
# установленного torch (CPU — только медленный CPU-инференс; CUDA —
# основной GPU-режим). GPU-машинам проще ставить файлом целиком:
#   pip install -r requirements-gpu.txt   (torch cu126 + весь этот стек)
# CUDA-сборку torch (+cu126) pip найдёт только с её индексом, поэтому
# torch экстрой не ставится — только файлом.
native = [
    "nnunetv2==2.6.2",
    "acvl_utils==0.2.5",
    "batchgenerators==0.25.1",
    "batchgeneratorsv2==0.3.0",
    "dynamic_network_architectures==0.4.2",
    "einops==0.8.1",
    "yacs==0.1.8",
    "tifffile==2025.5.10",
    "pandas==2.2.3",
    "scikit-learn==1.7.2",
]
dev = [
    "pyinstaller==6.17.0",
    "pytest>=8",
    "ruff>=0.8",
]

[project.gui-scripts]
radonc-gui = "gui.main:main"

[project.scripts]
radonc-pipeline = "radonc_segmentation.pipeline:main"

[tool.setuptools]
# gui и radonc_segmentation лежат в корне репозитория (не src-layout):
# config.py якорит пути проекта как dirname(dirname(__file__)),
# src-layout сломал бы этот якорь.
packages = [
    "radonc_segmentation",
    "radonc_segmentation.aligned",
    "radonc_segmentation.quantization",
    "radonc_segmentation.external_baselines",
    "gui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
