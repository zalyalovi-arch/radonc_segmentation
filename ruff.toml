# ============================================================
# ruff.toml — прицельный линтер: ошибки и «пыль», стиль не регламентируем
# ------------------------------------------------------------
# Принцип: кодовая база сложилась до линтера, поэтому включаем только
# правила, ловящие реальные проблемы (ошибки компиляции, импортов,
# escape-последовательности). Стилевые семейства (blind-except,
# try-except-pass, сортировка импортов, форматирование) сознательно
# выключены — это осознанный стиль проекта и предмет отдельного решения.
# Запуск: ruff check .   (auto-fix: ruff check --fix)
# ============================================================
exclude = [
    "build",
    "dist",
    "_screenshots",
    "__pycache__",
]

[lint]
select = [
    "E4",    # ошибки импортов/отступов
    "E7",    # statement-ошибки
    "E9",    # синтаксические/рантайм-ошибки (runpy, xinit)
    "F",     # pyflakes: неиспользуемые/переопределённые имена, f-strings
    "W605",  # невалидные escape-последовательности (в 3.12 уже SyntaxWarning)
    "RUF100",# мёртвые # noqa
]
ignore = [
    "E701",  # несколько операторов через «:» — стиль legacy quant-скриптов
]

[lint.per-file-ignores]
# стаб sys.modules["tensorboard"] обязан выполниться ДО import nncf
"radonc_segmentation/quantization/quantize_ov.py" = ["E402"]
