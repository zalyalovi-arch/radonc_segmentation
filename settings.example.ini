# ============================================================
# settings.ini — настройки программы
# ------------------------------------------------------------
# Это ШАБЛОН. Скопируйте его в settings.ini и поправьте пути:
#   copy settings.example.ini settings.ini
#
# settings.ini не публикуется в git (он в .gitignore) — там живут
# пути к вашим данным. Пример ниже расчитан на то, что модели и
# пациенты лежат в подпапках проекта (models\, patients\) — это
# переносимо между компьютерами.
#
# Пустое значение или относительный путь = подпапка проекта.
# ============================================================

[device]
; cpu — основной вариант (модель INT8, инференс OpenVINO);
; gpu может быть быстрее на машинах с дискретной видеокартой
DEVICE = cpu
; логические ядра CPU; при первом запуске подберётся автоматически
NUM_THREADS = 8
N_ASYNC_REQUESTS = 2
; LATENCY — минимальная задержка одного среза; THROUGHPUT не даёт
; выигрыша на этой модели (см. README)
PERFORMANCE_HINT = LATENCY

[inference]
; legacy — преобработка как при обучении v1; aligned — выровненная
; по nnUNet (ресемплинг в training spacing + глобальная нормализация)
VARIANT = legacy
FOLDS = 0,1,2,3,4
STEP_SIZE_RATIO = 0.5
; кроп воздуха по границе тома (ускоряет инференс)
CROP_AIR = true
AIR_THRESHOLD_HU = -300
CROP_MARGIN_VOXELS = 10
; disk — аккумулятор вероятностей на диске; ram — в памяти (быстрее,
; нужно ~7 ГБ ОЗУ под логиты 32 классов; подбирается автоматически)
ACCUMULATOR = disk

[model]
; Анатомическая модель: подпапка models\<MODEL_NAME>\<MODEL>
; Пример: models\headandneck\int8\fold_0\model.xml
MODEL_NAME = headandneck
; Квантизация: подпапка внутри models\<MODEL_NAME>\
MODEL = int8
; MODELS_ROOT можно оставить пустым (= подпапка models проекта)
MODELS_ROOT =

[paths]
; Пути к данным. Пусто = подпапки проекта (patients\, logs\, inbox\,
; validation\). Можно указать абсолютные пути к своим данным.
PATIENTS_ROOT =
LOG_DIR =
WATCH_DIR =
WATCH_POLL_SECONDS = 360
; Валидационные кейсы (опционально): validation\<MODEL_NAME>\<кейс>\
VALIDATION_ROOT =
DEFAULT_IMPORT_DIR =
DEFAULT_EXPORT_DIR =

[gui]
; Python conda-окружения для запуска скриптов пайплайна.
; Пусто = автопоиск в типовых местах conda (см. scripts\config.py).
; Заполняется автоматически при первом запуске.
CONDA_PYTHON =

[hardware]
; Отпечаток машины (заполняется автоматически при первом запуске —
; не редактируйте)
FINGERPRINT =
